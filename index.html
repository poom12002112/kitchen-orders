<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>點貨助手</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="點貨助手">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef2f3;--sf:#fff;--tx:#12222a;--mut:#62737b;--ac:#0e6b72;--on:#fff;--bd:#d5dfe2;--hi:#e0f1f2;--warn:#b4491a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--sf:#192329;--tx:#e8f0f2;--mut:#93a5ac;--ac:#4fc1c8;--on:#08181a;--bd:#2a3a42;--hi:#16343a;--warn:#f0905c}}
:root[data-theme="dark"]{--bg:#10181c;--sf:#192329;--tx:#e8f0f2;--mut:#93a5ac;--ac:#4fc1c8;--on:#08181a;--bd:#2a3a42;--hi:#16343a;--warn:#f0905c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
h2{font-size:17px;margin:28px 0 4px}
p.note{margin:0 0 10px;color:var(--mut);font-size:14px}
.seg{display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 0;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on)}
.list{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 84px 92px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row .nm b{display:block;font-weight:600}
.row .nm span{font-size:13px;color:var(--mut)}
input[type=number]{width:100%;font:inherit;font-size:17px;padding:9px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.res{text-align:right;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--mut)}
.res.go{color:var(--ac)}
.row.miss{background:var(--hi)}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;font-size:17px}
.btn.alt{background:none;color:var(--mut);border:1px solid var(--bd);font-weight:600;font-size:15px;margin-top:8px}
.msg{color:var(--warn);font-size:14px;margin:8px 0 0;min-height:1em}
.xrow{padding:12px;border-bottom:1px solid var(--bd)}
.xrow:last-child{border-bottom:0}
.xrow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.yn{display:flex;gap:6px}
.yn button{border:1px solid var(--bd);background:none;color:var(--tx);font:inherit;padding:8px 14px;border-radius:9px}
.yn button[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.xq{display:none;margin-top:8px;grid-template-columns:1fr 110px;gap:10px;align-items:center;color:var(--mut);font-size:14px}
.xrow.on .xq{display:grid}
pre{white-space:pre-wrap;margin:0;padding:14px;font:inherit;font-size:17px;line-height:1.7}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>點貨助手</h1>
<div class="seg" id="seg"></div>
<p class="note" style="margin-top:10px">表上數字是「要備到的量」。填入現有庫存，叫貨量 = 備到量 − 庫存。</p>
<div class="list" id="list"></div>
<p class="msg" id="msg"></p>
<button class="btn" id="done">盤點完成</button>

<section id="extra" hidden>
<h2>這幾項要叫嗎？</h2>
<p class="note">這些品項表上沒有數量。要的話請填叫貨數量，不要的話會跳過。</p>
<div class="list" id="xlist"></div>
<button class="btn" id="fin">產生叫貨清單</button>
<p class="msg" id="xmsg"></p>
</section>

<section id="out" hidden>
<h2 id="otitle">叫貨清單</h2>
<div class="list"><pre id="otext"></pre></div>
<button class="btn" id="copy">複製清單</button>
<button class="btn alt" id="reset">重新開始</button>
</section>
</main>
<script>
// 貨品表:[名稱, 平日, 假日, 單位, 週五(沒填就等於平日)]。平日為 null 代表沒有數量,盤點後再詢問。
const ITEMS=[["青蔥",1,2,"捆"],["玉米筍",10,18,"盒"],["蒜仁",1,2,"包"],["雪白菇",3,3,"包"],["鴻禧菇",3,3,"包"],["海帶結",1,2,"包"],["香竹腸",null,null,"箱"],["竹皮",2,2,"包"],["豆皮",null,null,"包"],["洋蔥",3,5,"斤"],["杏包菇c-3kg",0.5,1,"包"],["香菇",null,null,"包"],["蘭花",null,null,"斤"],["大黃瓜",3,6,"條"],["南瓜",5,8,"斤"],["小辣椒",null,null,"包"],["白蘿蔔",2,4,"斤"],["薑絲",1,2,"包"],["鮮柯",3,6,"斤"],["青江菜",4,10,"斤",6],["俄白菜",null,null,"斤"]].map(([n,p,h,u,f])=>({n,p,h,u,f}));
const DAYS=[["weekday","平日"],["friday","週五"],["holiday","假日"]];
const RULE={"杏包菇c-3kg":{weekday:[0.5,0.5],friday:[0.5,0.5],holiday:[1,1]},"白蘿蔔":{weekday:[1,1],friday:[1,1],holiday:[1,2,2]}}; // 特殊叫貨規則 [進位單位, 最少叫貨量, 最多叫貨量(可省略)],只在有缺口時套用
const $=s=>document.querySelector(s);
const fmt=n=>String(Math.round(n*100)/100);
const g=new Date().getDay();
let day=g===5?"friday":(g===0||g===6)?"holiday":"weekday";
let done=false;
const main=ITEMS.filter(i=>i.p!=null), extra=ITEMS.filter(i=>i.p==null);
const label=()=>DAYS.find(d=>d[0]===day)[1];
const par=i=>day==="holiday"?i.h:(day==="friday"&&i.f!=null?i.f:i.p);

const seg=$("#seg");
DAYS.forEach(([k,t])=>{const b=document.createElement("button");b.textContent=t;b.dataset.k=k;b.onclick=()=>{day=k;update();};seg.appendChild(b);});

main.forEach(it=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML='<div class="nm"><b></b><span></span></div><input type="number" inputmode="decimal" min="0" step="any" placeholder="庫存" aria-label="現有庫存"><div class="res"></div>';
  r.querySelector("b").textContent=it.n;
  it.row=r;it.pr=r.querySelector("span");it.inp=r.querySelector("input");it.res=r.querySelector(".res");
  it.inp.addEventListener("input",()=>{r.classList.remove("miss");update();});
  $("#list").appendChild(r);
});

extra.forEach(it=>{
  it.x=null;
  const r=document.createElement("div");r.className="xrow";
  r.innerHTML='<div class="top"><b></b><div class="yn"><button data-v="1" aria-pressed="false">要</button><button data-v="0" aria-pressed="false">不要</button></div></div><label class="xq"><span></span><input type="number" inputmode="decimal" min="0" step="any" placeholder="數量"></label>';
  r.querySelector("b").textContent=it.n;
  r.querySelector(".xq span").textContent="叫貨數量("+it.u+")";
  it.xr=r;it.xi=r.querySelector("input");
  r.querySelectorAll(".yn button").forEach(b=>b.onclick=()=>{
    it.x=b.dataset.v==="1";
    r.querySelectorAll(".yn button").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));
    r.classList.toggle("on",it.x);
    if(it.x)it.xi.focus();
  });
  $("#xlist").appendChild(r);
});

function need(it){
  if(it.inp.value==="")return null;
  const n=Math.max(par(it)-parseFloat(it.inp.value),0);
  const r=RULE[it.n]&&RULE[it.n][day];
  if(!r)return n;
  const m=Math.round(n*100)/100;
  return m>0?Math.min(Math.max(Math.ceil(m/r[0])*r[0],r[1]),r[2]||Infinity):0;
}
function update(){
  seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===day)));
  main.forEach(it=>{
    it.pr.textContent="備到 "+fmt(par(it))+" "+it.u;
    const n=need(it);
    it.res.className="res"+(n>0?" go":"");
    it.res.textContent=n===null?"—":n>0?"叫 "+fmt(n)+" "+it.u:"夠了";
  });
  if(done)build();
}
function lines(){
  const out=[];
  main.forEach(it=>{const n=need(it);if(n>0)out.push(it.n+" "+fmt(n)+" "+it.u);});
  extra.forEach(it=>{const q=parseFloat(it.xi.value);if(it.x&&q>0)out.push(it.n+" "+fmt(q)+" "+it.u);});
  return out;
}
function build(){
  const l=lines();
  $("#otitle").textContent="叫貨清單("+label()+")";
  $("#otext").textContent=l.length?l.join("\n")+"\n感謝 🙏":"這次沒有要叫的貨。";
  $("#out").hidden=false;
}
$("#done").onclick=()=>{
  const miss=main.filter(it=>it.inp.value==="");
  main.forEach(it=>it.row.classList.toggle("miss",it.inp.value===""));
  if(miss.length){
    $("#msg").textContent="還有 "+miss.length+" 項沒填庫存:"+miss.map(i=>i.n).join("、")+"。沒有庫存請填 0。";
    miss[0].row.scrollIntoView({block:"center"});miss[0].inp.focus();return;
  }
  $("#msg").textContent="";
  $("#extra").hidden=false;
  $("#extra").scrollIntoView({behavior:"smooth"});
};
$("#fin").onclick=()=>{
  const un=extra.filter(it=>it.x===null);
  const noq=extra.filter(it=>it.x&&!(parseFloat(it.xi.value)>0));
  if(un.length||noq.length){
    $("#xmsg").textContent=un.length?"還沒回答:"+un.map(i=>i.n).join("、"):"請填數量:"+noq.map(i=>i.n).join("、");
    return;
  }
  $("#xmsg").textContent="";
  done=true;build();
  $("#out").scrollIntoView({behavior:"smooth"});
};
$("#copy").onclick=async()=>{
  const t=$("#otitle").textContent+"\n"+$("#otext").textContent;
  try{await navigator.clipboard.writeText(t);}catch(e){
    const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");}catch(e2){}a.remove();
  }
  $("#copy").textContent="已複製";setTimeout(()=>$("#copy").textContent="複製清單",1500);
};
$("#reset").onclick=()=>{
  main.forEach(it=>{it.inp.value="";it.row.classList.remove("miss");});
  extra.forEach(it=>{it.x=null;it.xi.value="";it.xr.classList.remove("on");it.xr.querySelectorAll(".yn button").forEach(b=>b.setAttribute("aria-pressed","false"));});
  done=false;$("#extra").hidden=true;$("#out").hidden=true;$("#msg").textContent="";$("#xmsg").textContent="";
  update();window.scrollTo({top:0,behavior:"smooth"});
};
update();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
